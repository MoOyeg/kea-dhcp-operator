# Fast checks for every pull request (reliability plan, Release 1, H1).
# Cluster lifecycle and DHCP service suites run on a prepared runner before a
# release; they are not part of this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tool versions
        run: go version
      # make test also runs controller-gen, fmt and vet, downloads the envtest
      # binaries for ENVTEST_K8S_VERSION, and runs the controller envtest suite.
      - name: Unit and envtest suites
        run: make test
      - name: Lint
        run: make lint

  generated:
    name: Generated artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Deepcopy, CRDs, RBAC and bundle CRD schemas are up to date
        run: make verify-generated

  kea-parser:
    name: Kea parser compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tool versions
        run: |
          go version
          podman --version
      # KEA_CONFIG_CHECK=1 makes a missing podman a failure, not a skip. The
      # test logs the digest of each Kea image it parses against.
      - name: Rendered configurations pass the shipped Kea parsers
        env:
          KEA_CONFIG_CHECK: "1"
        run: go test ./internal/kea/ -run 'TestDDNSConfigAcceptedByKea|TestDatabaseBackendsLoadedByKea' -count=1 -v
