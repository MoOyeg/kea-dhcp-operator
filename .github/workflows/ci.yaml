# Fast checks for every pull request (reliability plan, Release 1, H1).
# Cluster lifecycle and DHCP service suites run on a prepared runner before a
# release; they are not part of this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tool versions
        run: go version
      # make test also runs controller-gen, fmt and vet, downloads the envtest
      # binaries for ENVTEST_K8S_VERSION, and runs the controller envtest suite.
      - name: Unit and envtest suites
        run: make test
      - name: Lint
        run: make lint

  generated:
    name: Generated artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Deepcopy, CRDs, RBAC and bundle CRD schemas are up to date
        run: make verify-generated

  kea-parser:
    name: Kea parser compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tool versions
        run: |
          go version
          podman --version
      # KEA_CONFIG_CHECK=1 runs every test in the package that starts a Kea
      # container, and makes a missing podman a failure, not a skip. The images
      # are the operator's defaults; each test logs "Kea image: <ref>@<digest>".
      - name: Rendered configurations pass the shipped Kea parsers
        env:
          KEA_CONFIG_CHECK: "1"
        # An explicit bash shell runs with pipefail, so tee keeps test failures.
        shell: bash
        run: go test ./internal/kea/ -count=1 -v 2>&1 | tee kea-parser.log
      - name: Kea images checked
        if: always()
        run: |
          { echo '### Kea images checked'; grep -o 'Kea image: .*' kea-parser.log | sort -u; } >> "$GITHUB_STEP_SUMMARY"

  envtest-versions:
    name: Controller envtest on Kubernetes ${{ matrix.k8s }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 1.28: the CSV's minKubeVersion (OperatorHub.io). 1.31: OpenShift
        # 4.18, the oldest release in com.redhat.openshift.versions. 1.35: a
        # current release. make test covers ENVTEST_K8S_VERSION. The CRD
        # upgrade specs in internal/controller behave differently before 1.33,
        # where CRD rules also apply to status writes.
        k8s: ["1.28.0", "1.31.0", "1.35.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # setup-envtest prints the path under --bin-dir as given; go test runs
      # in the package directory, so it must be absolute.
      - name: Controller suite
        run: |
          make envtest
          KUBEBUILDER_ASSETS="$(bin/setup-envtest use ${{ matrix.k8s }} --bin-dir "$PWD/bin" -p path)" \
            go test ./internal/controller/ -count=1
